name: Inspect official EES source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-official-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download official microdata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --user-agent "Salariometro data pipeline/0.1" \
            "https://www.ine.es/ftp/microdatos/salarial/datos_2022.zip" \
            --output datos_2022.zip
          sha256sum datos_2022.zip
          stat --printf='bytes=%s\n' datos_2022.zip

      - name: Inspect archive structure
        shell: bash
        run: |
          set -euo pipefail
          unzip -l datos_2022.zip
          mkdir extracted
          unzip -q datos_2022.zip -d extracted
          find extracted -type f -printf '%p\n' | sort

      - name: Print text metadata and data headers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            mime="$(file --brief --mime-type "$file")"
            size="$(stat --printf='%s' "$file")"
            printf '\nFILE %s | %s | %s bytes\n' "$file" "$mime" "$size"
            case "$mime" in
              text/*|application/json|application/xml)
                if [ "$size" -le 2000000 ]; then
                  sed -n '1,240p' "$file"
                else
                  sed -n '1,5p' "$file"
                fi
                ;;
            esac
          done < <(find extracted -type f | sort)

      - name: Print definitions used by Salariometro
        shell: bash
        run: |
          set -euo pipefail
          jq '.. | objects | select(tostring | test("NUTS1|ANOS2|SEXO|TIPOJOR|RETRINOIN|RETRIIN|GEXTRA|VESPNOIN|VESPIN|FACTOTAL"; "i"))' \
            extracted/dr_EES_2022.json
          sudo apt-get update -qq
          sudo apt-get install -y -qq antiword
          antiword "extracted/EES22 Obtención de los resultados publicados a partir de los microdatos web.doc"

      - name: Preserve official archive
        uses: actions/upload-artifact@v4
        with:
          name: ine-ees-2022-official-source
          path: datos_2022.zip
          if-no-files-found: error
          retention-days: 7
